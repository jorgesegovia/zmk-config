# This file generates the GitHub Actions matrix.
# For simple board + shield combinations, add them to the top level board and
# shield arrays, for more control, add individual board + shield combinations
# to the `include` property. You can also use the `cmake-args` property to
# pass flags to the build command, `snippet` to add a Zephyr snippet, and
# `artifact-name` to assign a name to distinguish build outputs from each other:
#
# board: [ "nice_nano" ]
# shield: [ "corne_left", "corne_right" ]
# include:
#   - board: bdn9_rev2
#   - board: nice_nano
#     shield: reviung41
#   - board: nice_nano
#     shield: corne_left
#     snippet: studio-rpc-usb-uart
#     cmake-args: -DCONFIG_ZMK_STUDIO=y
#     artifact-name: corne_left_with_studio
#
---
include:
  # Wireless builds without display
  - board: nice_nano
    shield: lily58_left
    snippet: studio-rpc-usb-uart
    artifact-name: lily58_left-nice_nano_v2-zmk
  - board: nice_nano
    shield: lily58_right
    artifact-name: lily58_right-nice_nano_v2-zmk
  # Wireless builds with nice_view display
  - board: nice_nano
    shield: lily58_left nice_view_adapter nice_view
    snippet: studio-rpc-usb-uart
    artifact-name: lily58_left_display-nice_nano_v2-zmk
  - board: nice_nano
    shield: lily58_right nice_view_adapter nice_view
    artifact-name: lily58_right_display-nice_nano_v2-zmk
